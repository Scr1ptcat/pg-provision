name: CI

on:
  push:
    branches: [ main, master ]
    tags: ['v*.*.*']
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pre-commit run --all-files

  unit:
    name: Unit tests (Ubuntu, py${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python }}
      - name: Run pytest
        run: uv run pytest -q
      - name: "Smoke: pgprovision dry-runs"
        run: |
          uv run pgprovision --dry-run
          uv run pgprovision --user-mode --dry-run
          uv run pgprovision --uninstall-cluster --uninstall-only --dry-run \
            --data-dir "$PWD/.pgprovision-uninstall-smoke"
      - name: "Artifact test (importlib.resources)"
        run: |
          uv run python - <<'PY'
          import os, sys
          from importlib.resources import files, as_file

          required = [
              ('_sh', 'provision.sh'),
              ('_sh', 'lib', 'runtime.sh'),
              ('_sh', 'lib', 'bootstrap.sh'),
              ('_sh', 'os', 'user.sh'),
          ]
          missing = []
          for parts in required:
              p = files('pgprovision').joinpath(*parts)
              with as_file(p) as f:
                  print(f)
                  if not os.path.exists(f):
                      missing.append('/'.join(parts))
          if missing:
              print(f"Missing package artifacts: {missing}", file=sys.stderr)
              sys.exit(1)
          PY

  fedora-smoke:
    name: Smoke (Fedora 42)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - name: Install git before checkout (enables full clone)
        run: |
          set -euxo pipefail
          dnf -y install git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and tools
        run: |
          set -euxo pipefail
          dnf -y install python3 sudo
      - name: Install package via uv tool
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION: 0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
        run: |
          set -euxo pipefail
          uv tool install --force .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "Smoke: pgprovision dry-runs"
        run: |
          set -euxo pipefail
          pgprovision --dry-run
          pgprovision --user-mode --dry-run
          pgprovision --uninstall-cluster --uninstall-only --dry-run \
            --data-dir "$PWD/.pgprovision-uninstall-smoke"
      - name: "Artifact test (importlib.resources)"
        run: |
          set -euxo pipefail
          TOOL_PYTHON="$(uv tool dir)/pg-provision/bin/python"
          "$TOOL_PYTHON" - <<'PY'
          import os, sys
          from importlib.resources import files, as_file
          p = files('pgprovision').joinpath('_sh', 'provision.sh')
          with as_file(p) as f:
              print(f)
              sys.exit(0 if os.path.exists(f) else 1)
          PY

  build:
    name: Build & check sdists/wheels
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Build dist
        run: |
          uv build
          uv run twine check dist/*
      - name: Install wheel and smoke
        run: |
          set -euxo pipefail
          uv tool install --force dist/*.whl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pgprovision --help
          pgprovision --dry-run
          pgprovision --user-mode --dry-run
          pgprovision --uninstall-cluster --uninstall-only --dry-run \
            --data-dir "$PWD/.pgprovision-uninstall-smoke"
      - name: Uninstall wheel tool
        run: uv tool uninstall pg-provision
      - name: Install sdist and smoke
        run: |
          set -euxo pipefail
          uv tool install --force dist/*.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pgprovision --help
          pgprovision --dry-run
          pgprovision --user-mode --dry-run
          pgprovision --uninstall-cluster --uninstall-only --dry-run \
            --data-dir "$PWD/.pgprovision-uninstall-smoke"
      - name: Artifact test (importlib.resources, sdist)
        run: |
          set -euxo pipefail
          TOOL_PYTHON="$(uv tool dir)/pg-provision/bin/python"
          "$TOOL_PYTHON" - <<'PY'
          import os, sys
          from importlib.resources import files, as_file
          p = files('pgprovision').joinpath('_sh', 'provision.sh')
          with as_file(p) as f:
              print(f)
              sys.exit(0 if os.path.exists(f) else 1)
          PY

  fedora-user-mode-smoke:
    name: User-mode smoke (Fedora 42)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - name: Install git before checkout (enables full clone)
        run: |
          set -euxo pipefail
          dnf -y install git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python, sudo, PostgreSQL binaries, and CI user
        run: |
          set -euxo pipefail
          dnf -y install python3 sudo shadow-utils postgresql-server postgresql
          useradd -m -s /bin/bash pgprovci
          chown -R pgprovci:pgprovci "$GITHUB_WORKSPACE"
          psql --version
      - name: Install package via uv tool
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION: 0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
        run: |
          set -euxo pipefail
          UV_BIN="$(command -v uv)"
          sudo -u pgprovci env \
            HOME=/home/pgprovci \
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION="$SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION" \
            "$UV_BIN" tool install --force .
          echo "/home/pgprovci/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve PostgreSQL binary metadata
        run: |
          set -euxo pipefail
          PG_MAJOR="$(psql --version | awk '{print $3}' | cut -d. -f1)"
          case "$PG_MAJOR" in
            ''|*[!0-9]*) echo "Unable to derive PostgreSQL major from psql --version" >&2; exit 1 ;;
          esac
          PG_BIN_DIR="$(dirname "$(command -v psql)")"
          for name in postgres initdb pg_ctl psql; do
            test -x "$PG_BIN_DIR/$name"
          done
          echo "PG_MAJOR=$PG_MAJOR" >> "$GITHUB_ENV"
          echo "PG_BIN_DIR=$PG_BIN_DIR" >> "$GITHUB_ENV"
      - name: Provision, stamp, destroy, and preview uninstall
        run: |
          set -euxo pipefail
          sudo -u pgprovci env \
            HOME=/home/pgprovci \
            PATH="/home/pgprovci/.local/bin:$PATH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            PG_MAJOR="$PG_MAJOR" \
            PG_BIN_DIR="$PG_BIN_DIR" \
            bash -euxo pipefail <<'BASH'
          cd "$GITHUB_WORKSPACE"
          PGPROVISION_BIN="$(command -v pgprovision)"
          SOCKET_GROUP="$(id -gn)"
          BASE="$PWD/.pgprovision-ci-user"
          rm -rf "$BASE"
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_MAJOR" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --create-db pgprov_user_ci
          test -f "$BASE/data/.pgprovision_provisioned.json"
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_MAJOR" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --destroy-db pgprov_user_ci --dry-run
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_MAJOR" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --destroy-db pgprov_user_ci \
            --confirm-destroy-db pgprov_user_ci --destroy-only
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_MAJOR" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --uninstall-cluster --uninstall-only --dry-run
          BASH

  integration-ubuntu-smoke:
    name: Integration smoke (Ubuntu PGDG)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && '18' || '16' }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION: 0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Provision, destroy, and preview uninstall
        run: |
          set -euxo pipefail
          PGPROVISION_BIN="$(command -v pgprovision)"
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" --repo pgdg \
            --create-db pgprov_ci_smoke
          sudo -u postgres psql -XAt -c "SHOW server_version;" | grep -E "^${PG_VERSION}([.]|$)"
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --destroy-db pgprov_ci_smoke --dry-run
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --destroy-db pgprov_ci_smoke \
            --confirm-destroy-db pgprov_ci_smoke --destroy-only
          "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --uninstall-cluster --uninstall-only --dry-run

  user-mode-smoke:
    name: User-mode smoke (Ubuntu)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && '18' || '16' }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION: 0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Install PostgreSQL binaries
        run: |
          set -euxo pipefail
          sudo -n install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo -n gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo -n tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          _apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              sudo -n apt-get update && return 0
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            return 1
          }
          _apt_retry
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "postgresql-${PG_VERSION}" "postgresql-client-${PG_VERSION}"
      - name: Provision, stamp, destroy, and preview uninstall
        run: |
          set -euxo pipefail
          PGPROVISION_BIN="$(command -v pgprovision)"
          PG_BIN_DIR="/usr/lib/postgresql/${PG_VERSION}/bin"
          SOCKET_GROUP="$(id -gn)"
          BASE="$PWD/.pgprovision-ci-user"
          rm -rf "$BASE"
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_VERSION" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --create-db pgprov_user_ci
          test -f "$BASE/data/.pgprovision_provisioned.json"
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_VERSION" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --destroy-db pgprov_user_ci --dry-run
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_VERSION" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --destroy-db pgprov_user_ci \
            --confirm-destroy-db pgprov_user_ci --destroy-only
          "$PGPROVISION_BIN" --user-mode --pg-version "$PG_VERSION" \
            --pg-bin-dir "$PG_BIN_DIR" \
            --user-base-dir "$BASE" --data-dir "$BASE/data" \
            --port 55432 --repo none --unix-socket-group "$SOCKET_GROUP" \
            --uninstall-cluster --uninstall-only --dry-run

  integration-ubuntu-destructive:
    name: Destructive uninstall (Ubuntu PGDG, PG ${{ matrix.pg }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '18']
    env:
      PG_VERSION: ${{ matrix.pg }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PG_PROVISION: 0.0.0.dev${{ github.run_number }}+g${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Preserve-PGDATA uninstall
        run: |
          set -euxo pipefail
          PGPROVISION_BIN="$(command -v pgprovision)"
          PRESERVE_DATA="/var/lib/postgresql/${PG_VERSION}/pgprov-preserve-ci"
          PREVIEW_LOG="$PWD/pgprov-uninstall-preserve-preview.log"
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" --repo pgdg \
            --data-dir "$PRESERVE_DATA" --create-db pgprov_uninstall_preserve
          "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --uninstall-cluster --uninstall-only --dry-run | tee "$PREVIEW_LOG"
          PRESERVE_TOKEN="$(sed -n 's/^confirm_token=//p' "$PREVIEW_LOG" | tail -n1)"
          test -n "$PRESERVE_TOKEN"
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --uninstall-cluster --uninstall-only \
            --confirm-uninstall "$PRESERVE_TOKEN"
          test -d "$PRESERVE_DATA"
          test -f "$PRESERVE_DATA/PG_VERSION"
          test -f "$PRESERVE_DATA/global/pg_control"
          ! pg_lsclusters --no-header | awk -v v="$PG_VERSION" '$1==v && $2=="main"{found=1} END{exit found?0:1}'
          sudo -n rm -rf "$PRESERVE_DATA"
      - name: Full package and PGDATA uninstall
        run: |
          set -euxo pipefail
          PGPROVISION_BIN="$(command -v pgprovision)"
          PREVIEW_LOG="$PWD/pgprov-uninstall-full-preview.log"
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" --repo pgdg \
            --create-db pgprov_uninstall_full
          "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --uninstall-cluster --uninstall-only --dry-run | tee "$PREVIEW_LOG"
          TOKEN="$(sed -n 's/^confirm_token=//p' "$PREVIEW_LOG" | tail -n1)"
          test -n "$TOKEN"
          sudo -n "$PGPROVISION_BIN" --pg-version "$PG_VERSION" \
            --uninstall-cluster --uninstall-only \
            --remove-pgdata --purge-packages \
            --confirm-uninstall "$TOKEN"
          ! test -d "/var/lib/postgresql/${PG_VERSION}/main"
          ! dpkg -l | grep -E "^ii[[:space:]]+postgresql-${PG_VERSION}([[:space:]]|$)"

  publish:
    name: Publish to PyPI (on tag)
    if: github.event_name != 'schedule' && startsWith(github.ref, 'refs/tags/v')   # only when pushing a v* tag
    needs: [pre-commit, unit, fedora-smoke, build]  # gate on publish checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # needed if you use setuptools_scm
          fetch-tags: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Build sdist/wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
